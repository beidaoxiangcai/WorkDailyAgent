[package]
name = "work-daily-agent"
version = "0.1.0"
description = "工作日报自动生成 Agent - 本地优先的智能工作记录与日报生成工具"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# 采集模块所需：异步运行时 + macOS 系统 API 绑定
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# macOS ApplicationServices / CoreFoundation 绑定，用于 NSWorkspace + Accessibility API
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSDictionary", "NSEnumerator"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "NSApplication", "NSWindow"] }

[features]
# 默认 custom-protocol 由 tauri 注入
